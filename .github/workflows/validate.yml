name: Validate plugin catalog
on: [push, pull_request]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.mjs
      - run: git diff --exit-code -- plugin.json packages/watch-together.wplugin
